name: Update JioTV playlists

on:
  workflow_dispatch:
  schedule:
    # Every 2 hours, on the hour.
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug egress
        run: |
          python -c "import requests; print(requests.get('https://httpbin.org/headers', headers={'x-test':'PROBE'}, timeout=20).text[:600])"
          python -c "import requests; print(requests.get('https://ipinfo.io/json', timeout=20).text[:400])"

      - name: Generate playlists
        env:
          JIOTV_KEY: ${{ secrets.JIOTV_KEY }}
          JIOTV_URL1: ${{ secrets.JIOTV_URL1 }}
          JIOTV_URL2: ${{ secrets.JIOTV_URL2 }}
          JIOTV_URL3: ${{ secrets.JIOTV_URL3 }}
          JIOTV_DIR: .
        run: python jiotv.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jiotvplus.m3u jiotvplus2.m3u jiotvplus3.m3u
          if git diff --cached --quiet; then
            echo "Playlists unchanged; nothing to commit."
          else
            git commit -m "Update JioTV playlists - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
